apiVersion: v1
kind: ConfigMap
metadata:
  name: kuber-practice-app-service-config
data:
  PORT: "8080"
  POSTGRES_USER: "kuber-practice-app-user"
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "kuber-practice-app-db"
  MIGRATIONS_DIRECTORY: "/app/db/migrations"
  REDIS_HOST: {{ .Values.redis.host | quote }}
